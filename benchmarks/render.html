<!doctype html>
<html lang="zh-CN">
  <meta charset="UTF-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>雨停之前 · 渲染基准</title
  ><style>
    body {
      margin: 0;
      background: #263747;
      color: #eee;
      font: 14px system-ui;
    }
    canvas {
      width: min(960px, 100vw);
      height: auto;
      aspect-ratio: 16 / 9;
      display: block;
    }
    pre {
      white-space: pre-wrap;
    }
    button {
      padding: 12px;
    }</style
  ><label
    >范围
    <select id="scope">
      <option value="full">全部：基准关 + 第28—40关单人/六人</option>
      <option value="quick">快速：第1/11/12关</option>
    </select></label
  >
  <label
    >画质
    <select id="quality">
      <option value="standard">标准</option>
      <option value="economy">省电</option>
    </select></label
  >
  <button id="run">运行渲染基准</button
  ><button id="stop" disabled>停止</button>
  <span id="status">准备就绪 · 自适应窗口 · 固定步长（全部约 2.5 分钟）</span
  ><button id="snapshot">导出菜单背景</button
  ><textarea
    aria-label="菜单背景数据"
    id="snapshot-data"
    style="display: none"
  ></textarea
  ><canvas></canvas>
  <pre id="result"></pre>
  <p>
    需要保持页面可见。结果只代表当前设备与浏览器；CPU 提交时间不是 GPU
    时间。本工具覆盖首帧、转面与场景区域，不模拟真实通关，也不代表其他手机性能。
  </p>
  <script type="module" src="./render.ts"></script>
</html>
