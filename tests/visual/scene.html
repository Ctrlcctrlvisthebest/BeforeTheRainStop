<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>场景遮挡回归检查</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #182835;
        color: #eee6d4;
        font: 14px system-ui;
      }
      header {
        height: 100px;
        padding: 12px 20px;
      }
      label {
        margin-right: 18px;
      }
      select,
      button {
        font: inherit;
        padding: 4px;
      }
      p {
        margin: 10px 0;
        color: #a9bdce;
      }
      canvas {
        display: block;
        width: 100vw;
        height: calc(100dvh - 100px);
      }
    </style>
  </head>
  <body>
    <header>
      <label
        >关卡
        <select id="chapter"></select
      ></label>
      <label
        >人数
        <select id="mode">
          <option value="1">单人</option>
          <option value="2">双人</option>
        </select></label
      >
      <label
        >位置
        <select id="location"></select
      ></label>
      <label
        >视角
        <select id="view">
          <option value="0">正面</option>
          <option value="1">侧面</option>
        </select></label
      >
      <label
        >跟随
        <select id="local">
          <option value="0">玩家 1</option>
          <option value="1">玩家 2</option>
        </select></label
      >
      <button id="turn">转面</button>
      <button id="probe">检查重叠面稳定性</button
      ><output id="probe-result" aria-live="polite"></output>
      <label
        >镜头测试
        <select id="motion">
          <option value="still">静止</option>
          <option value="jitter">轻微位置抖动</option>
          <option value="walk">来回移动</option>
          <option value="turn">反复转面</option>
        </select></label
      >
      <label
        >互动
        <select id="interaction">
          <option value="idle">静置</option>
          <option value="aligned">桥口对齐</option>
          <option value="offset">桥口错位</option>
          <option value="bridge">撑起纸桥</option>
          <option value="release">踩住接桥板</option>
          <option value="bridged">木桥已接通</option>
          <option value="gate-wait">一人踩门踏板</option>
          <option value="gate">全部踏板踩住</option>
          <option value="opened">闸门已开</option>
          <option value="repair">修补中</option>
          <option value="repaired">修补完成</option>
        </select></label
      >
      <label
        >语言
        <select id="language">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select></label
      >
      <p>
        本地视觉回归：使用真实地图与渲染器、固定互动状态，不连接排行榜。此页不进入发布包。
      </p>
    </header>
    <canvas aria-label="场景遮挡回归画面"></canvas>
    <script type="module" src="./scene.ts"></script>
  </body>
</html>
